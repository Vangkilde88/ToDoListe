<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Klubbens visuelle udvikling</title><link rel="stylesheet" href="styles.css"><style>body{padding:28px;max-width:1180px;margin:auto}header{margin-bottom:24px}#stages{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}#stages button{min-height:44px;padding:12px 20px;border-radius:10px;background:#dce6d7}#stages button[aria-pressed=true]{background:#174d3d;color:white}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:24px}article{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px}article svg{width:100%;height:150px}article h3{font-size:14px}.landscape-controls{display:none}</style></head>
<body><header><p class="eyebrow">DESIGNOVERSIGT · SEPARAT FRA FAMILIENS DATA</p><h1>Fra græsplæne til drømmeklub</h1><p>Illustrationerne, som bruges i appen. Vælg et trin for at se udviklingen.</p></header><nav id="stages"></nav><main id="scene" class="world-card"></main><section id="gallery" aria-label="Alle 48 opgraderinger"></section><script type="module">
import {ITEMS,normalize} from './game.mjs';
import {world,upgradeArt} from './world.mjs';
const stages=[['Start',[]],['Lokalstadion',['net','flags','bench','stand','balls','cones','minigoal','pitch','shed','changing','house','vests','kit']],['Arena',['net','flags','bench','score','fence','stand','lights','bigstand','roof','arena','balls','cones','ladder','minigoal','wall','pitch','gym','hall','shed','changing','showers','house','cafe','shop','vests','kit','captain','assistant','keeper','coach','bus']],['Endgame',ITEMS.map(i=>i.id)]];
function show(index){const k=normalize({}).kids.Arthur;k.club.name='Vangkilde United';for(const id of stages[index][1])k.purchases[id]={};document.querySelector('#scene').innerHTML=world(k);document.querySelector('#stages').innerHTML=stages.map(([label],i)=>`<button data-stage="${i}" aria-pressed="${i===index}">${label}</button>`).join('');}
document.querySelector('#stages').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b)show(Number(b.dataset.stage));});
document.querySelector('#gallery').innerHTML=ITEMS.map(i=>`<article>${upgradeArt(i)}<h3>${i.name}</h3></article>`).join('');show(0);
</script></body></html>
