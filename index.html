<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Min ToDo Liste</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7;
      margin: 0;
      padding: 25px;
    }

    h1 {
      margin-top: 40px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      font-weight: bold;
    }

    ul {
      padding: 0;
    }

    li {
      list-style: none;
      background: white;
      padding: 16px;
      margin-top: 10px;
      border-radius: 12px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Min ToDo Liste</h1>
  <p>Hvad skal jeg huske?</p>

  <input id="opgave" placeholder="Skriv en opgave...">

  <button onclick="tilfoej()">Tilføj</button>

  <ul id="liste"></ul>

</div>

<script>

function tilfoej() {

  const input = document.getElementById("opgave");

  if (input.value.trim() === "") return;

  const punkt = document.createElement("li");

  punkt.textContent = "☐ " + input.value;

  punkt.onclick = function() {
    punkt.remove();
  };

  document.getElementById("liste").appendChild(punkt);

  input.value = "";
}

</script>

</body>
</html>
